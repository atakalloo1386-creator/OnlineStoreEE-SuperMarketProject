<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>فروشگاه آموزشی | Jakarta EE</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
    <header class="border-bottom bg-white">
        <div class="container-fluid px-lg-4 py-3 d-flex flex-wrap gap-3 align-items-center justify-content-between">
            <a href="index.html" class="brand text-decoration-none text-dark">فروشگاه آموزشی <span class="badge text-bg-light ms-2" dir="ltr">Jakarta EE</span></a>
            <a class="btn btn-sm btn-outline-primary" href="docs/index.html">مستندات Attachment</a>
        </div>
    </header>
    <div class="container-fluid px-lg-4 py-4">
        <div class="row g-4">
            <aside class="col-lg-3 col-xl-2">
                <p class="small text-secondary mb-2">بخش‌های پروژه</p>
                <nav id="navigation" aria-label="بخش‌های فروشگاه" class="module-nav"></nav>
                <details class="mt-4 p-3 bg-white border rounded">
                    <summary class="small fw-semibold">اطلاعات دسترسی API</summary>
                    <form id="credentials-form" class="mt-3">
                        <label class="form-label small" for="auth-username">نام کاربری</label>
                        <input id="auth-username" name="username" class="form-control form-control-sm mb-2" autocomplete="username" required dir="ltr">
                        <label class="form-label small" for="auth-password">رمز عبور</label>
                        <input id="auth-password" name="password" type="password" class="form-control form-control-sm mb-3" autocomplete="current-password" required dir="ltr">
                        <button class="btn btn-sm btn-primary" type="submit">اعمال</button>
                        <button class="btn btn-sm btn-outline-secondary" id="clear-credentials" type="button">پاک کردن</button>
                    </form>
                    <p id="auth-status" class="small text-secondary mt-3 mb-0">اطلاعات دسترسی تنظیم نشده است.</p>
                    <p class="small text-secondary mt-2 mb-0">اطلاعات فقط تا بسته‌شدن یا بارگذاری مجدد صفحه در حافظه نگهداری می‌شود.</p>
                </details>
            </aside>
            <main class="col-lg-9 col-xl-10">
                <div class="d-flex flex-wrap gap-3 justify-content-between align-items-start mb-3">
                    <div><h1 id="page-title" class="h4 mb-2">مدیریت فروشگاه</h1><p id="page-description" class="text-secondary small mb-0"></p></div>
                    <div class="d-flex gap-2">
                        <button id="refresh" class="btn btn-outline-secondary btn-sm" type="button">بارگذاری مجدد</button>
                        <button id="new-record" class="btn btn-primary btn-sm" type="button">افزودن</button>
                    </div>
                </div>
                <div id="message" role="status" aria-live="polite"></div>
                <div id="module-note" class="alert alert-warning small" hidden></div>
                <section class="bg-white border rounded p-3 mb-3">
                    <form id="filters" class="row g-3 align-items-end"></form>
                    <div class="d-flex flex-wrap gap-3 mt-3 align-items-center justify-content-between">
                        <input id="search" class="form-control form-control-sm search-input" placeholder="جست‌وجو در ردیف‌های نمایش‌داده‌شده" aria-label="جست‌وجو در ردیف‌های نمایش‌داده‌شده" type="search">
                        <label id="page-size-label" class="small d-flex gap-2 align-items-center">تعداد در صفحه
                            <select id="page-size" class="form-select form-select-sm"><option value="10">۱۰</option><option value="25">۲۵</option><option value="50">۵۰</option></select>
                        </label>
                    </div>
                </section>
                <section class="bg-white border rounded" aria-label="اطلاعات بخش">
                    <div id="loading" class="p-4 text-secondary" hidden><span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>در حال دریافت اطلاعات...</div>
                    <div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead id="table-head" class="table-light"></thead><tbody id="table-body"></tbody></table></div>
                    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 p-3 border-top">
                        <span id="row-count" class="small text-secondary"></span>
                        <div id="pagination" class="d-flex gap-2 align-items-center">
                            <button id="previous-page" class="btn btn-sm btn-outline-secondary" type="button">قبلی</button>
                            <span id="page-info" class="small"></span>
                            <button id="next-page" class="btn btn-sm btn-outline-secondary" type="button">بعدی</button>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>
    <dialog id="editor" class="form-dialog" aria-labelledby="editor-title">
        <div class="d-flex justify-content-between align-items-center p-3 border-bottom"><h2 id="editor-title" class="h5 mb-0"></h2><button id="close-editor" type="button" class="btn-close" aria-label="بستن"></button></div>
        <div id="editor-message" class="px-3 pt-3" role="alert"></div>
        <div id="editor-body" class="p-3"></div>
    </dialog>
    <noscript><p class="alert alert-warning m-4">برای استفاده از این رابط، JavaScript را فعال کنید.</p></noscript>
    <script type="module" src="assets/js/app.js"></script>
</body>
</html>
